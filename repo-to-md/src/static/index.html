<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>repo-to-md - Diff Review</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <h1>repo-to-md</h1>
            <span class="ref-info" id="refInfo">Loading...</span>
        </div>
        <div class="header-right">
            <button class="button button-shutdown" id="shutdownBtn" title="Quit the review server">
                Quit
            </button>
        </div>
    </header>

    <main class="main-content">
        <file-tree class="sidebar"></file-tree>
        <diff-view class="diff-container"></diff-view>
    </main>

</body>
<script type="module" src="/js/app.js"></script>
<script type="module">
import { App } from "./js/app.js";
document.addEventListener('DOMContentLoaded', () => {
    const app = new App();
    app.init().catch(err => console.error(err));
});
</script>
</html>
