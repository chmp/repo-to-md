<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Tests</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 {
            color: #fff;
            border-bottom: 2px solid #4a4a6a;
            padding-bottom: 10px;
        }
        .instructions {
            background: #2a2a4e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .instructions h2 {
            margin-top: 0;
            color: #8be9fd;
        }
        .instructions code {
            background: #3a3a5e;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .instructions ol {
            padding-left: 20px;
        }
        .instructions li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <h1>Frontend Unit Tests</h1>

    <div class="instructions">
        <h2>How to run</h2>
        <ol>
            <li>Open browser developer tools (<code>F12</code>)</li>
            <li>Navigate to the <code>Console</code> tab</li>
            <li>Test results will appear in the console</li>
            <li>Green = passed, Red = failed</li>
        </ol>
    </div>

    <p>Loading tests...</p>

    <!-- Test framework -->
    <script src="js/test/minitest.js"></script>

    <!-- Tests -->
    <script type="module" src="js/test/utils.test.js"></script>
    <script type="module" src="js/test/components.test.js"></script>

    <script>
        document.querySelector('p').textContent = 'Tests loaded. Check the console for results.';
    </script>
</body>
</html>
