<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Tests</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 {
            color: #fff;
            border-bottom: 2px solid #4a4a6a;
            padding-bottom: 10px;
        }
        .instructions {
            background: #2a2a4e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .instructions h2 {
            margin-top: 0;
            color: #8be9fd;
        }
        .instructions code {
            background: #3a3a5e;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .instructions ol {
            padding-left: 20px;
        }
        .instructions li {
            margin-bottom: 8px;
        }
        #test-results {
            background: #202040;
            border: 1px solid #4a4a6a;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }
        .test-result {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-top: 1px solid #3a3a5e;
        }
        .test-result:first-child {
            border-top: none;
        }
        .test-result.failed {
            color: #ff8080;
        }
    </style>
</head>
<body>
    <h1>Frontend Unit Tests</h1>

    <p id="test-status">Loading tests...</p>
    <div id="test-results"></div>

    <!-- Test framework -->
    <script src="js/test/minitest.js"></script>

    <!-- Tests -->
    <script type="module" src="js/test/utils.test.js"></script>
    <script type="module" src="js/test/components.test.js"></script>

    <script>
        const status = document.getElementById('test-status');
        const results = document.getElementById('test-results');
        const summaries = [];
        window.frontendTestResults = summaries;
        minitest.onResult(result => {
            summaries.push(result);
            const passed = summaries.reduce((total, item) => total + item.passed, 0);
            const total = summaries.reduce((sum, item) => sum + item.total, 0);
            const errors = summaries.reduce((sum, item) => sum + item.errors, 0);
            status.textContent = summaries.length === 0
                ? 'Tests loaded. Waiting for results...'
                : `Frontend tests passed: ${passed}/${total}`;
            results.innerHTML = summaries.map(item => `
                <div class="test-result ${item.errors ? 'failed' : ''}">
                    <span>${item.name}</span>
                    <span>${item.passed}/${item.total}</span>
                </div>
            `).join('');
            if (errors > 0) {
                status.textContent += ` (${errors} errors)`;
            }
        });
        status.textContent = 'Tests loaded. Waiting for results...';
    </script>
</body>
</html>
