[package]
name = "repo-to-md"
version = "0.1.0"
edition = "2024"

[lib]
name = "review_to_md"
path = "src/lib.rs"

[[bin]]
name = "repo-to-md"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
argh = "0.1"
pathsearch = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
insta = "1.40"
tempfile = "3.10"
