[package]
name = "repo-to-md"
version = "0.1.0"
edition = "2024"

[lib]
name = "review_to_md"
path = "src/lib.rs"

[[bin]]
name = "repo-to-md"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
argh = "0.1"
axum = "0.8"
open = "5"
pathsearch = "0.2"
regex = "1"
rust-embed = "8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syntect = "5"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
insta = "1.40"
